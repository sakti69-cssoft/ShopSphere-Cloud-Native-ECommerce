worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout combined;
  server_tokens off;
  sendfile on;
  client_max_body_size 10m;
  map $http_x_correlation_id $correlation_id { default $http_x_correlation_id; "" $request_id; }
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 80;
    server_name shopsphere-sakti.duckdns.org;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; default_type text/plain; try_files $uri =404; }
    location = /nginx-health { access_log off; return 200 "healthy\n"; add_header Content-Type text/plain; }
    location /api/ {
      set $gateway_upstream http://gateway:8080;
      proxy_pass $gateway_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Correlation-ID $correlation_id;
    }
    location / {
      set $frontend_upstream http://frontend:3000;
      proxy_pass $frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
