name: Security
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '25 3 * * 1'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret hygiene
        run: node scripts/check-secrets.mjs
      - name: Trivy repository secret scan
        run: >-
          docker run --rm -v "$PWD:/src:ro"
          aquasec/trivy:0.74.0 fs --scanners secret
          --skip-dirs /src/.git --skip-dirs /src/frontend/node_modules --skip-dirs /src/frontend/.next
          --skip-dirs /src/.tools --skip-dirs /src/.validation --skip-dirs /src/terraform/.terraform
          --skip-dirs /src/services/auth-service/target --skip-dirs /src/services/product-service/target
          --skip-dirs /src/services/inventory-service/target --skip-dirs /src/services/cart-service/target
          --skip-dirs /src/services/order-service/target --skip-dirs /src/gateway/target
          --skip-files '**/pom.xml'
          --exit-code 1 /src
      - name: Trivy repository configuration scan
        run: >-
          docker run --rm -v "$PWD:/src:ro" -w /src
          aquasec/trivy:0.74.0 config
          --skip-dirs /src/.git --skip-dirs /src/frontend/node_modules --skip-dirs /src/frontend/.next
          --skip-dirs /src/.tools --skip-dirs /src/.validation --skip-dirs /src/terraform/.terraform
          --skip-dirs /src/services/auth-service/target --skip-dirs /src/services/product-service/target
          --skip-dirs /src/services/inventory-service/target --skip-dirs /src/services/cart-service/target
          --skip-dirs /src/services/order-service/target --skip-dirs /src/gateway/target
          --severity HIGH,CRITICAL --exit-code 1 --ignorefile .trivyignore /src
