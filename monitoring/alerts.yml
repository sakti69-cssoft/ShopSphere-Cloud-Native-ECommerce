groups:
  - name: shopsphere
    rules:
      - alert: ServiceUnavailable
        expr: up{job="shopsphere"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "ShopSphere target unavailable: {{ $labels.instance }}"}
      - alert: HighErrorRate
        expr: sum by(instance) (rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum by(instance) (rate(http_server_requests_seconds_count[5m])), 0.01) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "HTTP 5xx ratio exceeds 5%"}
      - alert: HighLatency
        expr: histogram_quantile(0.95, sum by(le,instance) (rate(http_server_requests_seconds_bucket[5m]))) > 2
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "HTTP p95 latency exceeds 2 seconds"}
      - alert: HighJvmHeap
        expr: sum by(instance) (jvm_memory_used_bytes{area="heap"}) / sum by(instance) (jvm_memory_max_bytes{area="heap"}) > 0.85
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "JVM heap utilization exceeds 85%"}
      - alert: GatewayFailureSpike
        expr: sum(rate(spring_cloud_gateway_requests_seconds_count{httpStatusCode=~"5.."}[5m])) > 1
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "Gateway downstream failures exceed 1/sec"}
      - alert: HostHighCpu
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "ShopSphere host CPU exceeds 85% for 10 minutes"}
      - alert: HostHighMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 85
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "ShopSphere host memory utilization exceeds 85%"}
      - alert: HostLowDisk
        expr: 100 * node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} < 15
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "ShopSphere root filesystem has less than 15% free"}
      - alert: ContainerHighMemory
        expr: 100 * container_memory_working_set_bytes{name=~"shopsphere-prod-.+"} / clamp_min(container_spec_memory_limit_bytes{name=~"shopsphere-prod-.+"}, 1) > 90
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "Container memory exceeds 90% of its limit: {{ $labels.name }}"}
      - alert: MonitoringTargetUnavailable
        expr: up{job="node"} == 0
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "Monitoring target unavailable: {{ $labels.job }}"}
      - alert: ContainerMetricsStale
        expr: time() - shopsphere_container_metrics_timestamp_seconds > 120 or absent(shopsphere_container_metrics_timestamp_seconds)
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "Host container metrics collector stopped updating"}
      - alert: ContainerUnhealthy
        expr: shopsphere_container_healthy == 0
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "ShopSphere container unhealthy: {{ $labels.name }}"}
