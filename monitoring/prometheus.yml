global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: shopsphere
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway:8080", "auth-service:8081", "product-service:8082", "inventory-service:8083", "cart-service:8084", "order-service:8085"]
