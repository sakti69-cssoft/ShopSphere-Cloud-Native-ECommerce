groups:
  - name: shopsphere
    rules:
      - alert: ServiceUnavailable
        expr: up{job="shopsphere"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "ShopSphere target unavailable: {{ $labels.instance }}"}
      - alert: HighErrorRate
        expr: sum by(instance) (rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum by(instance) (rate(http_server_requests_seconds_count[5m])), 0.01) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "HTTP 5xx ratio exceeds 5%"}
      - alert: HighLatency
        expr: histogram_quantile(0.95, sum by(le,instance) (rate(http_server_requests_seconds_bucket[5m]))) > 2
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "HTTP p95 latency exceeds 2 seconds"}
      - alert: HighJvmHeap
        expr: sum by(instance) (jvm_memory_used_bytes{area="heap"}) / sum by(instance) (jvm_memory_max_bytes{area="heap"}) > 0.85
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "JVM heap utilization exceeds 85%"}
      - alert: GatewayFailureSpike
        expr: sum(rate(spring_cloud_gateway_requests_seconds_count{httpStatusCode=~"5.."}[5m])) > 1
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "Gateway downstream failures exceed 1/sec"}
