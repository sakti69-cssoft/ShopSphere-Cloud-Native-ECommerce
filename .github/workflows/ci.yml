name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [gateway, services/auth-service, services/product-service, services/inventory-service, services/cart-service, services/order-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -f ${{ matrix.app }}/pom.xml test package
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tests-${{ strategy.job-index }}
          path: ${{ matrix.app }}/target/surefire-reports/
  security:
    uses: ./.github/workflows/security.yml
  terraform:
    uses: ./.github/workflows/terraform.yml
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend, backend, security, terraform]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
