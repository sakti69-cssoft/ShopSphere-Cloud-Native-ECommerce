worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout combined;
  server_tokens off;
  sendfile on;
  gzip on;
  gzip_types application/json application/javascript text/css text/plain application/xml;
  client_max_body_size 10m;
  map $http_x_correlation_id $correlation_id { default $http_x_correlation_id; "" $request_id; }
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 80;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    location = /nginx-health { access_log off; return 200 "healthy\n"; add_header Content-Type text/plain; }
    location /api/ {
      set $gateway_upstream http://gateway:8080;
      proxy_pass $gateway_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Correlation-ID $correlation_id;
      proxy_connect_timeout 3s;
      proxy_send_timeout 10s;
      proxy_read_timeout 10s;
    }
    location / { return 404; }
  }
}
