name: Deploy production via SSM

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact reviewed 40-character commit SHA on main
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: shopsphere-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Approved SSM deployment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      AWS_REGION: ap-south-1
      INSTANCE_ID: i-0e2cf0109097385b1
      PUBLIC_URL: https://shopsphere-sakti.duckdns.org
      REVISION: ${{ inputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0

      - name: Validate approved revision
        shell: bash
        run: |
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REVISION"
          git fetch --quiet origin main
          git merge-base --is-ancestor "$REVISION" origin/main

      - name: Configure short-lived AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity and SSM target
        run: |
          aws sts get-caller-identity --query Arn --output text
          test "$(aws ssm describe-instance-information \
            --filters Key=InstanceIds,Values="$INSTANCE_ID" \
            --query 'InstanceInformationList[0].PingStatus' --output text)" = "Online"

      - name: Deploy exact revision through SSM
        shell: bash
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          owner=${GHCR_OWNER,,}
          parameters=$(jq -cn \
            --arg revision "$REVISION" \
            --arg owner "$owner" \
            --arg url "$PUBLIC_URL" \
            '{commands:[
              "set -euo pipefail",
              "cd /opt/shopsphere",
              "git fetch --quiet --no-tags origin main",
              ("git show " + $revision + ":scripts/deploy-production-revision.sh > /tmp/shopsphere-deploy.sh"),
              "chmod 700 /tmp/shopsphere-deploy.sh",
              ("SHOPSPHERE_DIR=/opt/shopsphere /tmp/shopsphere-deploy.sh " + $revision + " " + $owner + " " + $url)
            ]}')

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ShopSphere $REVISION" \
            --parameters "$parameters" \
            --query 'Command.CommandId' --output text)

          if ! aws ssm wait command-executed \
            --command-id "$command_id" --instance-id "$INSTANCE_ID"; then
            aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent}'

      - name: Verify public production health
        run: |
          curl --fail --silent --show-error --output /dev/null "$PUBLIC_URL/"
          curl --fail --silent --show-error --output /dev/null "$PUBLIC_URL/nginx-health"
          curl --fail --silent --show-error --output /dev/null "$PUBLIC_URL/api/v1/products"
